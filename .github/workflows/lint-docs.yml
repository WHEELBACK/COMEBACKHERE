name: Lint Docs

on:
  pull_request:
    branches: [main]
  workflow_call: # called by ci-summary.yml

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Lint markdown documentation
        run: ./scripts/lint-docs.sh

name: Playwright E2E

on:
  pull_request:
    branches: [main]
    paths:
      - 'comebackhere-frontend/**'
  workflow_call: # called by ci-summary.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: comebackhere-frontend

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: comebackhere-frontend/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('comebackhere-frontend/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('comebackhere-frontend/package-lock.json') }}

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        run: npm run build

      - name: Start preview server
        run: npm run preview &
        env:
          VITE_API_BASE_URL: http://localhost:3000/api

      - name: Wait for preview server
        run: npx wait-on http://localhost:4173

      - name: Run Playwright tests
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@a8a3f3ad30e987fea8aa2a54bccb630c0d519b66 # v4.7.0
        with:
          name: playwright-report
          path: comebackhere-frontend/playwright-report/
          retention-days: 7

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@a8a3f3ad30e987fea8aa2a54bccb630c0d519b66 # v4.7.0
        with:
          name: playwright-traces
          path: comebackhere-frontend/.playwright/
          retention-days: 7

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.1.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@959cbb7472c4d4ad70f4d6894a946c4ee1f27409 # v3.24.10
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@959cbb7472c4d4ad70f4d6894a946c4ee1f27409 # v3.24.10

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@959cbb7472c4d4ad70f4d6894a946c4ee1f27409 # v3.24.10
        with:
          category: "/language:${{ matrix.language }}"

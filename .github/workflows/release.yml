name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  admin-key-separation-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.1.1
        with:
          fetch-depth: 0

      - name: Validate contract admin-key separation
        env:
          INVOICE_ADMIN_KEY: ${{ secrets.INVOICE_ADMIN_KEY }}
          TREASURY_ADMIN_KEY: ${{ secrets.TREASURY_ADMIN_KEY }}
          COMPLIANCE_ADMIN_KEY: ${{ secrets.COMPLIANCE_ADMIN_KEY }}
          ADMIN_KEY_SEPARATION_EXCEPTION: ${{ vars.ADMIN_KEY_SEPARATION_EXCEPTION }}
        run: |
          set -euo pipefail

          # Documented separation: invoice, treasury, and compliance admin keys
          # must be distinct. Reuse is blocked unless an explicit, recorded
          # exception is approved via the ADMIN_KEY_SEPARATION_EXCEPTION variable.
          missing=0
          for name in INVOICE_ADMIN_KEY TREASURY_ADMIN_KEY COMPLIANCE_ADMIN_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Admin-key separation preflight failed: required admin keys are not configured."
            exit 1
          fi

          reuse=0
          if [ "$INVOICE_ADMIN_KEY" = "$TREASURY_ADMIN_KEY" ]; then
            echo "::error::invoice and treasury admin keys are identical"
            reuse=1
          fi
          if [ "$INVOICE_ADMIN_KEY" = "$COMPLIANCE_ADMIN_KEY" ]; then
            echo "::error::invoice and compliance admin keys are identical"
            reuse=1
          fi
          if [ "$TREASURY_ADMIN_KEY" = "$COMPLIANCE_ADMIN_KEY" ]; then
            echo "::error::treasury and compliance admin keys are identical"
            reuse=1
          fi

          if [ "$reuse" -ne 0 ]; then
            if [ -n "${ADMIN_KEY_SEPARATION_EXCEPTION:-}" ]; then
              echo "::warning::Admin-key separation exception recorded: ${ADMIN_KEY_SEPARATION_EXCEPTION}"
              echo "Proceeding despite key reuse due to approved exception."
              exit 0
            fi
            echo "Admin-key separation preflight failed: admin keys must be distinct."
            echo "Record an approved exception in the ADMIN_KEY_SEPARATION_EXCEPTION repository variable to override."
            exit 1
          fi

          echo "Admin-key separation preflight passed: invoice, treasury, and compliance admin keys are distinct."

  release:
    needs: admin-key-separation-preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: '3.12'

      - name: Generate release notes
        run: |
          ./scripts/generate_release_notes.sh > /tmp/release_notes.md
          cat /tmp/release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@69032c45a6f1f0f29ccf0b114b021659ca73a36e # v2.0.5
        with:
          body_path: /tmp/release_notes.md
          files: abis/*.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

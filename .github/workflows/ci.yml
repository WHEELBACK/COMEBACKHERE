name: CI

on:
  pull_request:
    branches: [main]
  workflow_call: # called by ci-summary.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: comebackhere-frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: comebackhere-frontend/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('comebackhere-frontend/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Generate typed API client
        run: npm run generate:api-client

      - name: Check generated client is up to date
        run: |
          if [ -n "$(git status --porcelain -- src/api/generated)" ]; then
            echo "::error::Generated API client is stale. Run 'npm run generate:api-client' and commit the result."
            git --no-pager diff -- src/api/generated
            exit 1
          fi

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --run

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.7.0
        with:
          name: coverage-summary
          path: comebackhere-frontend/coverage
          retention-days: 7

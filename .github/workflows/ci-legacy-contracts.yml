name: CI - Legacy Contracts

# Test the legacy contracts/ workspace (issue #751).
# This ensures that the in-tree contracts/ copy doesn't break even though
# development now targets COMEBACKHERE-contracts/.

on:
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**'
  workflow_call: # called by ci-summary.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test (legacy)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests for legacy contracts
        run: cargo test --manifest-path contracts/Cargo.toml

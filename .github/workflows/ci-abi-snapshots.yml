name: CI - ABI Snapshots

on:
  pull_request:
    branches: [main]
  workflow_call: # called by ci-summary.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-abi:
    name: check-abi-snapshots
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: WHEELBACK/COMEBACKHERE-contracts
          ref: main
          path: COMEBACKHERE-contracts

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            COMEBACKHERE-contracts/target
          key: ${{ runner.os }}-cargo-abi-${{ hashFiles('COMEBACKHERE-contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-abi-

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - run: make check-abi-snapshots

      - name: Check for stale ABI snapshots
        run: git diff --exit-code abis/

name: CI - ABI Snapshots

on:
  pull_request:
    branches: [main]
  workflow_call: # called by ci-summary.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-abi:
    name: check-abi-snapshots
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: WHEELBACK/COMEBACKHERE-contracts
          ref: main
          path: COMEBACKHERE-contracts

      - uses: actions-rust-lang/setup-rust-toolchain@9399c7bb15d4c7d47b27263d024f0a4978346ba4 # v1.11.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            COMEBACKHERE-contracts/target
          key: ${{ runner.os }}-cargo-abi-${{ hashFiles('COMEBACKHERE-contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-abi-

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - run: make check-abi-snapshots

      - name: Check for stale ABI snapshots
        run: git diff --exit-code abis/

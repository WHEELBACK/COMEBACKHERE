[package]
name = "api-integration-tests"
version = "0.1.0"
edition = "2021"

# Integration tests only; not a library or binary.

[[test]]
name = "api"
path = "tests/api.rs"

[dev-dependencies]
comebackhere-treasury = { path = "../treasury" }
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde_json = "1"
soroban-sdk = { workspace = true, features = ["testutils"] }